name: wechat_bill
description: 导入微信支付账单并自动分类记账
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.9
  archive: ^3.6.1
  excel: ^4.0.6
  path_provider: ^2.1.5
  intl: ^0.20.2
  provider: ^6.1.5
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#07C160"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
